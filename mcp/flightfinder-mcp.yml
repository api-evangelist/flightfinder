tools:
- name: search_accidents
  description: 'Search the merged aviation-accident corpus (occurrence-level dedup). Filters: family slug,
    ISO alpha-2 country, occurrence type, operator substring, date range, fatal-only. Returns a page plus
    next_cursor.'
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /events
- name: get_accident
  description: Fetch one occurrence by FlightFinder id, with source-attribution links and narrative refs.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /events/{id}
- name: get_narrative
  description: Fetch an investigation narrative by (source, case id). Open-licensed sources return full
    text; others a <=300-char excerpt plus a source_url deep link.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /narratives/{source}/{id}
- name: aircraft_safety
  description: 'Aggregate safety statistics for an aircraft family: occurrences, hull losses, fatal accidents,
    fatalities, first/latest year.'
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /aircraft/{family}/safety
- name: list_sources
  description: Every data source with its license, homepage, narrative count and republication policy.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /sources
- name: airport_reference
  description: Resolve an airport by ICAO ident or IATA code (OurAirports, CC0).
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /airports/{ident}
- name: wildlife_strikes
  description: FAA National Wildlife Strike Database. No arguments gives global totals and the yearly
    series; airport OR species gives that breakdown.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /wildlife-strikes (+ /airport/{slug},
    /species/{slug})
- name: laser_incidents
  description: FAA Reported Laser Incidents. No arguments gives national totals; state OR airport gives
    that breakdown.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /laser-strikes (+ /state/{slug},
    /airport/{slug})
- name: drone_sightings
  description: FAA UAS sighting reports. No arguments gives national totals; state gives that breakdown.
  source_operation: openapi/flightfinder-aviation-safety-data-openapi.json#GET /drone-sightings (+ /state/{slug})
