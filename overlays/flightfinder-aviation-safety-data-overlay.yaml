    description: FAA wildlife-strike, laser-incident and drone-sighting datasets.
  - name: Reference
    description: Airport reference data and the source/licence registry.
  - name: Keys
    description: Account-authenticated API key lifecycle.
  - name: System
    description: Connectivity and key verification.
