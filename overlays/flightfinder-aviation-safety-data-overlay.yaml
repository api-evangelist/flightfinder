x-gaps-not-fixed-here:
- No 5xx response is declared on any operation. An overlay could add one, but that
  would assert a contract the provider has not made — reported instead.
- The hazard aggregate responses are untyped objects. Modelling them would be
  authoring the provider's schemas, not enhancing them.
- No request/response examples exist. Adding them would put values into the
  provider's contract that the provider never published.
