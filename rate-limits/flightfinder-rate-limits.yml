response_headers:
  standard: draft-ietf-httpapi-ratelimit-headers (RFC 9331 family), lower-cased over HTTP/2
  emitted_on: every response, not only 429
  headers:
  - name: RateLimit-Policy
    example: 100;w=86400
    description: The quota and its window in seconds.
  - name: RateLimit-Limit
    example: '100'
    description: The ceiling for the current window.
  - name: RateLimit-Remaining
    example: '91'
    description: Requests left in the current window.
  - name: RateLimit-Reset
    example: '86167'
    description: Seconds until the window resets.
  - name: Retry-After
    example: '3600'
    description: >-
      Sent on 429 only. Seconds — time to UTC midnight for the daily quota, up to 60
      for the per-minute limiter. Declared in components.responses.RateLimited.
exhaustion:
  status: 429
  code: rate_limited
  envelope: '{"error": {"code": "rate_limited", "message": "..."}}'
  retry_signal: Retry-After (seconds)
notes:
- >-
  A newly created key, or an upgrade to pro, can take up to 5 minutes to be visible
  to every worker — so an agent should not treat the first post-upgrade 429 as final.
- >-
  The RapidAPI listing fronts the same origin and may apply its own quota on top of
  these limits; the provider says so on the developer page.
- >-
  CORS is open (access-control-allow-origin: *) and every /api response carries
  X-Robots-Tag: noindex, nofollow.
