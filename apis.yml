name: FlightFinder
description: 'Read-only JSON API over a merged aviation-safety corpus: 164,068 accident narratives aggregated
  from 130 official investigation authorities (NTSB, ATSB, AAIB, BEA, MAK and national agencies), deduplicated
  into one occurrence-level dataset, plus the FAA wildlife-strike, laser-incident and drone-sighting datasets
  and OurAirports reference data. Every record carries its source, attribution, licence and a deep link,
  and GET /sources returns the per-source licence and narrative policy. Keyless tier answers without an
  Authorization header at 100 requests/day/IP, and the same corpus is served to agents by an anonymous
  remote MCP server at https://himaxym.com/mcp with nine tools.'
image: https://himaxym.com/og-image.png?v=2
url: https://raw.githubusercontent.com/api-evangelist/flightfinder/refs/heads/main/apis.yml
